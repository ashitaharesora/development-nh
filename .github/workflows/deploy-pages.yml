name: Build and Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  repository_dispatch:
    types: [microcms-update]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Fetch posts from microCMS and generate posts.json
        env:
          MICROCMS_SERVICE_ID: ${{ vars.MICROCMS_SERVICE_ID }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_ENDPOINT_NEWS: ${{ vars.MICROCMS_ENDPOINT_NEWS }}
          MICROCMS_ENDPOINT_BLOGS: ${{ vars.MICROCMS_ENDPOINT_BLOGS }}
        run: |
          mkdir -p assets/data

          if [ -z "$MICROCMS_SERVICE_ID" ] || [ -z "$MICROCMS_API_KEY" ]; then
            echo "microCMS variables not configured. Skipping fetch."
            exit 0
          fi

          ENDPOINT_NEWS="${MICROCMS_ENDPOINT_NEWS:-news}"
          ENDPOINT_BLOGS="${MICROCMS_ENDPOINT_BLOGS:-blog}"
          BASE_URL="https://$MICROCMS_SERVICE_ID.microcms.io/api/v1"

          echo "Fetching news from $ENDPOINT_NEWS ..."
          curl --fail-with-body --silent --show-error \
            "$BASE_URL/$ENDPOINT_NEWS?limit=100&orders=-publishedAt" \
            -H "X-MICROCMS-API-KEY: $MICROCMS_API_KEY" \
            -o /tmp/news_raw.json

          echo "Fetching blog from $ENDPOINT_BLOGS ..."
          curl --fail-with-body --silent --show-error \
            "$BASE_URL/$ENDPOINT_BLOGS?limit=100&orders=-publishedAt" \
            -H "X-MICROCMS-API-KEY: $MICROCMS_API_KEY" \
            -o /tmp/blog_raw.json

          # Merge into a single posts.json (API key never written to output)
          jq -n \
            --slurpfile news /tmp/news_raw.json \
            --slurpfile blog /tmp/blog_raw.json \
            '{
              news: ($news[0].contents // []),
              blog: ($blog[0].contents // [])
            }' \
            > assets/data/posts.json

          echo "posts.json generated:"
          jq '{news_count: (.news | length), blog_count: (.blog | length)}' assets/data/posts.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
