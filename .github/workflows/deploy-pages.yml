name: Build and Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  repository_dispatch:
    types: [microcms-update]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Fetch posts from microCMS
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ vars.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_ENDPOINT_NEWS: ${{ vars.MICROCMS_ENDPOINT_NEWS }}
          MICROCMS_ENDPOINT_BLOGS: ${{ vars.MICROCMS_ENDPOINT_BLOGS }}
          MICROCMS_ENDPOINT_CATEGORIES: ${{ vars.MICROCMS_ENDPOINT_CATEGORIES }}
        run: |
          echo "=== 設定確認 ==="
          if [ -z "$MICROCMS_SERVICE_DOMAIN" ]; then
            echo "SKIP: MICROCMS_SERVICE_DOMAIN (Variable) が未設定のためfetchをスキップします。"
            exit 0
          fi
          if [ -z "$MICROCMS_API_KEY" ]; then
            echo "SKIP: MICROCMS_API_KEY (Secret) が未設定のためfetchをスキップします。"
            exit 0
          fi
          echo "MICROCMS_SERVICE_DOMAIN: $MICROCMS_SERVICE_DOMAIN"
          echo "MICROCMS_API_KEY: [set, length=$(echo -n "$MICROCMS_API_KEY" | wc -c | tr -d ' ')]"
          echo "ENDPOINT_NEWS: ${MICROCMS_ENDPOINT_NEWS:-news}"
          echo "ENDPOINT_BLOGS: ${MICROCMS_ENDPOINT_BLOGS:-column}"
          echo "ENDPOINT_CATEGORIES: ${MICROCMS_ENDPOINT_CATEGORIES:-(未設定)}"

          npm ci || npm install
          npm run fetch:cms

          echo "=== 生成結果 ==="
          for f in assets/data/news.json assets/data/blogs.json assets/data/categories.json; do
            if [ -f "$f" ]; then
              COUNT=$(jq '.contents | length' "$f" 2>/dev/null || echo "?")
              echo "$f: $COUNT 件"
            else
              echo "$f: 生成されていません"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
