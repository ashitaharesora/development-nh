<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ seo_title }} | コラム | ashitaHARESORA′</title>
  <meta name="description" content="{{ description }}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="icon" href="/assets/img/Logo_1.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/Logo_1.svg">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script defer src="/assets/js/main.js"></script>
</head>

<body class="static-header-unified">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="高野晶弘税理士事務所 はれそら社労士事務所 トップページ">
        <img class="brand-logo" src="/assets/img/Logo.PNG" alt="ashitaHARESORA′ ロゴ">
        <span class="brand-text">
          <span class="brand-kicker">税理士・社労士</span>
          <span class="brand-name">
            <span class="brand-name-tax">高野晶弘税理士事務所</span>
            <span class="brand-name-labor">はれそら社労士事務所</span>
          </span>
        </span>
      </a>
      <nav class="nav site-nav-static" id="site-nav">
        <div class="nav-list">
          <a class="nav-item" href="/">ホーム</a>
          <a class="nav-item" href="/services/">サービス・料金</a>
          <a class="nav-item" href="/news/">お知らせ・コラム</a>
          <a class="nav-item" href="/about/">事務所案内</a>
          <a class="nav-item" href="/faq/">FAQ</a>
          <div class="nav-cta-group">
            <a class="nav-item cta cta-free" href="/contact/">無料相談</a>
            <a class="nav-item cta cta-phone" href="tel:XXX-XXX-XXXX">TEL XXX-XXX-XXXX</a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="breadcrumbs">
          <a href="/">ホーム</a> / <a href="/blog/">コラム</a> / <span>{{ title }}</span>
        </p>
        <h2>{{ title }}</h2>
        <p class="meta">{{ date }}{{ category_label }}</p>
      </div>
    </section>
    <section class="section">
      <div class="container content">
        {{ body_html }}
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="/news/">お知らせ・コラム</a>
        <a href="/contact/">お問い合わせ</a>
        <a href="/privacy/">プライバシーポリシー</a>
        <a href="/access/">アクセス</a>
      </div>
      <div>© <span data-year></span> ashitaHARESORA′</div>
    </div>
  </footer>

  <div class="floating-cta" id="floating-cta" aria-label="お問い合わせ固定ボタン">
    <a class="floating-cta-item floating-cta-free" href="/contact/">無料相談</a>
    <a class="floating-cta-item floating-cta-phone" href="tel:XXX-XXX-XXXX">TEL XXX-XXX-XXXX</a>
  </div>
</body>
</html>
